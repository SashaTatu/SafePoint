<!DOCTYPE html>
<html lang="ua">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/assets/favicon/favicon.png">
    <link rel="stylesheet" href="/css/device.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <title>SafePoint</title>
</head>
<body>
    <header>
        <div class="header-container-left">
            <input type="checkbox" id="checkbox">
            <label for="checkbox" class="toggler">
                <span class="ball"></span>
                <i class="ri-sun-line sun"></i>
                <i class="ri-moon-line moon"></i>
            </label>
            <h1>SafePoint</h1>
        </div>
        <div class="header-container-right">
            <p id="user-avatar" class="avatar">O</p>
            <i class="fas fa-bell"></i>
            <div id="user-menu" class="user-menu hidden">
                <button id="edit-profile-btn" class="edit">
                    <i class="fas fa-user-edit"></i> Редагувати профіль
                </button>
                <button id="logout-btn" class="logout">
                    <i class="fas fa-sign-out-alt"></i> Вийти
                </button>
            </div>
        </div>

        <div id="editModal" class="modal">
            <div class="modal-content">
                <h2>Редагувати профіль</h2>
                <input id="name" text="text" placeholder="">
                <select id="region" name="region" class="region-select">
                    <option value="" disabled selected></option>
                    <option value="vinnytska">Вінницька</option>
                    <option value="dnipropetrovska">Дніпропетровська</option>
                    <option value="volynska">Волинська</option>
                    <option value="donetska">Донецька</option>
                    <option value="zhytomyrska">Житомирська</option>
                    <option value="zakarpatska">Закарпатська</option>
                    <option value="zaporizka">Запорізька</option>
                    <option value="ivano-frankivska">Івано-Франківська</option>
                    <option value="kyivska">Київська</option>
                    <option value="kirovohradska">Кіровоградська</option>
                    <option value="luhanska">Луганська</option>
                    <option value="lvivska">Львівська</option>
                    <option value="mykolaivska">Миколаївська</option>
                    <option value="odeska">Одеська</option>
                    <option value="poltavska">Полтавська</option>
                    <option value="rivnenska">Рівненська</option>
                    <option value="sumska">Сумська</option>
                    <option value="ternopilska">Тернопільська</option>
                    <option value="kharkivska">Харківська</option>
                    <option value="khersonska">Херсонська</option>
                    <option value="khmelnytska">Хмельницька</option>
                    <option value="cherkaska">Черкаська</option>
                    <option value="chernivetska">Чернівецька</option>
                    <option value="chernihivska">Чернігівська</option>
                    <option value="kyiv">м. Київ</option>
                    <option value="sevastopol">м. Севастополь</option>
                    <option value="crimea">Автономна Республіка Крим</option>
                </select>
                <button id="save-profile">Зберегти</button>
            </div>
        </div>
    </header>
    <div>
        <i class="fas fa-arrow-left" data-toggle="tooltip" title="Повернутися" id="return_btn"></i>
    </div>

    <main>
        <div id="alert-container" class="alert-container">
            <h3>Стан укриття</h3>
            
            <div class="status-line">
                <span>Тривога:</span>
                <span id="alert-status" class="status-text"></span>
            </div>
            
            <div class="status-line">
                <span>Стан укриття:</span>
                <span id="door-status" class="status-text"></span>
            </div>

            <div class="lock-img-container">
                <img id="lock-img" src="/assets/img-device/lock.png" alt="Замок">
            </div>

            <button id="door-btn" class="door-btn" onclick="updateDoorStatus(deviceId, this)"></button>
        </div>
        <div class="sensor-wrapper">
            <div class="sensor-card">
                <h2>Показники датчика</h2>
                
                <p  class="sensor-line" data-warn-min="12" data-warn-max="28" data-danger-min="10" data-danger-max="30">
                    <span>Температура:</span>
                    <span><span id="temperature" class="sensor-value">--</span> °C</span>
                </p>

                <p   class="sensor-line" data-warn-min="35" data-warn-max="70" data-danger-min="20" data-danger-max="80">
                    <span>Вологість:</span>
                    <span><span id="humidity" class="sensor-value">--</span> %</span>
                </p>

                <p class="sensor-line" data-warn-max="1000" data-danger-max="1200">
                    <span>CO₂:</span>
                    <span><span id="co2" class="sensor-value">--</span> ppm</span>
                </p>
            </div>

            <div class="refresh-container">
                <button id="refresh-data" class="refresh-btn">
                    <i class="fas fa-sync-alt"></i>
                    <span>Оновити дані</span>
                </button>
            </div>
        </div>
        <div class="list-container">
            <h2 class="list">В процесі розробки</h2>
        </div>
    </main>

    <footer>
        <div class="footer-nav">
            <div class="active-bg"></div> 
            
            <button class="nav-btn active" id="acess-btn">
                <i class="ri-shield-keyhole-line"></i>
                <span>Доступ</span>
            </button>

            <button class="nav-btn" id="sensor-btn">
                <i class="ri-numbers-line"></i>
                <span>Показники</span>
            </button>

            <button class="nav-btn" id="list-btn">
                <i class="ri-file-list-3-line"></i>
                <span>Список</span>
            </button>
        </div>

            <div id="chart-modal" class="modal">
                <div class="modal-content" style="max-width: 600px; width: 90%;">
                    <h2 id="chart-title" style="margin-bottom: 20px;">Динаміка</h2>
                    
                    <div style="height: 300px; width: 100%;">
                        <canvas id="sensorChart"></canvas>
                    </div>
                    
                    <button onclick="closeChart()" style="margin-top: 20px;">Закрити</button>
                </div>
            </div>
    </footer>
    <script src="/js/device.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</body>
</html>
